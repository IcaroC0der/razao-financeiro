<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="9" fill="#111412"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="8.25" fill="#171B18" stroke="#2B352E" stroke-width="1"/>
  
  <!-- Marcador Superior (Numerador / Razão) -->
